name: iOS 앱

# 아이폰 앱은 Mac 에서만 빌드된다 → GitHub 의 Mac 서버에서 서명 없이 빌드해 .ipa 를 만든다.
# 받은 .ipa 는 윈도우 PC 의 Sideloadly 로 내 Apple ID 서명을 붙여 아이폰에 설치한다 (docs/ios-sideload.md)
on:
  workflow_dispatch:
  push:
    branches: [main, feat/ios-app]
    paths:
      - 'frontend/ios/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package-lock.json'
      - 'frontend/native-shell/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: 아이폰 앱 빌드 (서명 없음)
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npx cap sync ios
      - name: 빌드
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      # 파일 이름에 앱 버전(MARKETING_VERSION)을 붙인다: anam3-ios-v1.2.0.ipa (docs/app-versions.md)
      - name: 앱 버전
        id: version
        run: echo "v=$(grep -m1 'MARKETING_VERSION' ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*= *([^;]+);.*/\1/')" >> "$GITHUB_OUTPUT"
      - name: .ipa 로 묶기
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa && zip -qry ../anam3-ios-v${{ steps.version.outputs.v }}.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: anam3-ios-v${{ steps.version.outputs.v }}
          path: frontend/build/anam3-ios-v${{ steps.version.outputs.v }}.ipa
          retention-days: 14

# 운영 배포용. 필요한 환경변수 (render.yaml 에 목록이 있다)
#  - DATABASE_URL : postgresql://user:pass@host/db?sslmode=require (Neon 연결 문자열 그대로)
#    또는 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#  - JWT_SECRET, OWNER_EMAIL
#  - KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET
#  - SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, (MAIL_FROM)
app:
  jwt:
    secret: ${JWT_SECRET}

spring:
  datasource:
    # DATABASE_URL 이 없을 때 jar 안의 H2(메모리 DB)로 조용히 뜨지 않고 시작을 멈춘다
    embedded-database-connection: none
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000

server:
  tomcat:
    threads:
      max: 30 # 메모리 512MB 에 맞춤

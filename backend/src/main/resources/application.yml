# 공통 설정. 프로필별 설정은 application-{local,prod}.yml
# 아무 프로필도 지정하지 않으면 local (H2 인메모리 DB + 샘플 데이터) 로 뜬다.
spring:
  application:
    name: anam3
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 테이블 변경은 반드시 Flyway 마이그레이션(db/migration)으로!
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 30d
  # 가입할 때 필요한 입장 코드 (운영자 페이지에서 바꿀 수 있음)
  invite-code: ${INVITE_CODE:anam3}
  # 가입 때 고를 수 있는 최신 기수 (운영 페이지에서 바꿀 수 있음)
  latest-cohort: ${LATEST_COHORT:62}
  admin:
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:관리자}
    cohort: ${ADMIN_COHORT:61}
  cors:
    # 프론트를 다른 도메인에 따로 배포할 때만. 쉼표로 여러 개 (예: https://anam3.vercel.app)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    org.hibernate.orm.deprecation: error

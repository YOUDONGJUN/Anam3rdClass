<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>안암3교시 · 수업 끝나고 번개</title>
    <meta name="description" content="IT연합회(고려대·연세대·성균관대·서강대·한양대) 대학원 원우 번개 모임. 성사되기 전까지는 이름이 가려져서 부담 없어요." />
    <meta name="theme-color" content="#1b2533" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="안암3교시" />
    <script>
      // 첫 화면을 그리기 전에 테마를 붙인다 (깜빡임 방지). 규칙은 src/lib/theme.ts 와 같다
      ;(function () {
        try {
          var p = JSON.parse(localStorage.getItem('anam3.theme') || '{}')
          var s = localStorage.getItem('anam3.school')
          var known = ['KU', 'YONSEI', 'SKKU', 'SOGANG', 'HANYANG'].indexOf(s) >= 0
          var r = document.documentElement
          var mode = p.mode === 'light' || p.mode === 'dark' ? p.mode : 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          r.setAttribute('data-theme', p.color !== 'basic' && known ? 'school' : 'basic')
          r.setAttribute('data-mode', dark ? 'dark' : 'light')
          if (known) r.setAttribute('data-school', s)
        } catch (e) {}
      })()
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="안암3교시 · 수업 끝나고 번개" />
    <meta property="og:description" content="IT연합회 대학원 원우 번개 모임. 최소 인원이 모이면 성사! 그때 서로 이름이 공개돼요." />
    <meta property="og:locale" content="ko_KR" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

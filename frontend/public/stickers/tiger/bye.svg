<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<style>.run{animation:bob .45s ease-in-out infinite alternate}
.look{transform-origin:120px 170px;animation:tilt 1.1s ease-in-out infinite alternate}
.beat{transform-origin:120px 186px;animation:beat .8s ease-in-out infinite}
.jump{animation:jump .55s ease-in-out infinite alternate}
.twinkle,.shake,.clink,.pop,.wave,.jiggle,.pulse{transform-box:fill-box}
.twinkle{transform-origin:center;animation:twinkle .9s ease-in-out infinite alternate}
.drip{animation:drip 1s ease-in-out infinite alternate}
.shake{transform-origin:center;animation:shake .25s ease-in-out infinite alternate}
.clink{transform-origin:left bottom;animation:clink .6s ease-in-out infinite alternate}
.pop{transform-origin:center bottom;animation:pop .7s ease-in-out infinite alternate}
.wave{transform-origin:left bottom;animation:wave .5s ease-in-out infinite alternate}
.jiggle{transform-origin:center bottom;animation:shake .18s ease-in-out infinite alternate}
.bow{animation:bob 1s ease-in-out infinite alternate}
.pulse{transform-origin:center bottom;animation:beat 1s ease-in-out infinite}
.drool{animation:drool 1.2s ease-in infinite}
@keyframes bob{to{transform:translateY(-6px)}}
@keyframes tilt{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes beat{50%{transform:scale(1.14)}}
@keyframes jump{to{transform:translateY(-12px)}}
@keyframes twinkle{from{transform:scale(.6);opacity:.5}to{transform:scale(1.1);opacity:1}}
@keyframes drip{to{transform:translateY(3px);opacity:.8}}
@keyframes shake{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes clink{from{transform:rotate(-6deg)}to{transform:rotate(10deg)}}
@keyframes pop{to{transform:scale(1.12)}}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes drool{from{transform:translateY(0);opacity:1}to{transform:translateY(10px);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

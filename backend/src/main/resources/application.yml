# 공통 설정. 프로필별 설정은 application-{local,prod}.yml
# 아무 프로필도 지정하지 않으면 local (H2 인메모리 DB + 샘플 데이터 + 개발용 로그인) 로 뜬다.
spring:
  application:
    name: anam3
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 테이블 변경은 반드시 Flyway 마이그레이션(db/migration)으로!
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # 학교·학과처럼 작은 표를 여러 줄에서 가리킬 때 한 번에 불러온다 (N+1 방지)
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  # 인증코드 메일 (SMTP). SPRING_MAIL_HOST 를 넣었을 때만 메일을 보내고, 없으면 서버 로그에 코드를 남긴다.
  # 예: Gmail → SPRING_MAIL_HOST=smtp.gmail.com, SPRING_MAIL_PORT=587,
  #           SPRING_MAIL_USERNAME=보내는주소@gmail.com, SPRING_MAIL_PASSWORD=앱 비밀번호(16자리)
  mail:
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 30d
  # 대학원장(최고 관리자)의 학교 이메일. 이 이메일로 인증한 계정이 대학원장이 된다 (늘 1명)
  owner:
    email: ${OWNER_EMAIL:}
  # 카카오 디벨로퍼스 > 앱 > 플랫폼 키 > REST API 키 / 클라이언트 시크릿
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 같은 화면의 "앱 ID" (숫자). 안드로이드 앱에서 카카오톡으로 로그인할 때 필요
    app-id: ${KAKAO_APP_ID:}
  # 앱 푸시 알림. Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > 새 비공개 키 (JSON 내용 그대로, 또는 base64)
  # 없으면 알림을 보내지 않고 서버 로그에만 남긴다
  push:
    firebase-service-account: ${FIREBASE_SERVICE_ACCOUNT:}
    reminders: true
  meetup:
    # 내가 열었거나 참여한 3교시끼리 모임 시간이 2시간 안이면 열기·참여를 막는다
    overlap-check: true
  # 스토어 심사용 계정 (학교 메일이 없는 심사관이 이메일 + 비밀번호로 로그인). 둘 다 넣었을 때만 만든다
  review:
    email: ${REVIEW_EMAIL:}
    password: ${REVIEW_PASSWORD:}
  # 공유 링크를 앱으로 열기 (/.well-known/assetlinks.json). 앱 서명 인증서 SHA-256, 쉼표로 여러 개
  # (Play Console > 앱 무결성 > 앱 서명 키 인증서 · 업로드 키 인증서)
  android:
    package-name: kr.anam3.app
    cert-sha256: ${ANDROID_CERT_SHA256:}
  mail:
    # 보내는 사람 주소 (비우면 SPRING_MAIL_USERNAME)
    from: ${MAIL_FROM:}
  # 약관·문의 화면에 보이는 연락처 (앱스토어 심사에 필요). 비우면 "교수·대학원장에게 문의"로 안내한다
  support:
    email: ${SUPPORT_EMAIL:}
  cors:
    # 프론트를 다른 도메인에 따로 배포할 때만. 쉼표로 여러 개 (예: https://anam3.vercel.app)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    org.hibernate.orm.deprecation: error
